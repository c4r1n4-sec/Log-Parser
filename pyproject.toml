[project]
name = "tdsynnex-carbon-black-log-parser"
version = "0.1.0"
description = "Portable local-only Windows desktop skeleton for parsing Carbon Black logs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "Jinja2>=3.1,<4"
]

[project.scripts]
tdsynnex-carbon-black-log-parser = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
