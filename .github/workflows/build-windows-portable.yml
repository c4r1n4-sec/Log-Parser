name: Build Windows Portable Drag/Drop ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable ZIP
        run: powershell -ExecutionPolicy Bypass -File .\build-portable.ps1

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TDSYNNEX-CB-LogParser-portable
          path: dist/TDSYNNEX-CB-LogParser-portable.zip
          if-no-files-found: error

      - name: Stage script portable runner
        shell: pwsh
        run: |
          $scriptPortable = Join-Path $env:RUNNER_TEMP "TDSYNNEX-CB-LogParser-script-portable"
          Remove-Item -Recurse -Force $scriptPortable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $scriptPortable | Out-Null
          Copy-Item -Recurse -Path app, rules, templates, tools, docs -Destination $scriptPortable
          Copy-Item -Path RUN-CB-LOG-PARSER.bat, requirements-cli.txt, README.md -Destination $scriptPortable

      - name: Upload script portable runner
        uses: actions/upload-artifact@v4
        with:
          name: TDSYNNEX-CB-LogParser-script-portable
          path: ${{ runner.temp }}/TDSYNNEX-CB-LogParser-script-portable
          if-no-files-found: error
