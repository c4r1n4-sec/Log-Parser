name: Build Windows Portable Drag/Drop ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-portable:
    name: Build portable Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        shell: powershell
        run: python -m pytest -q

      - name: Build portable drag/drop ZIP
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build-portable.ps1

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDSYNNEX-CB-LogParser-portable
          path: dist/TDSYNNEX-CB-LogParser-portable.zip
          if-no-files-found: error
